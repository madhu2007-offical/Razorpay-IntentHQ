[project]
name = "intenthq-core"
version = "1.0.0"
description = "Razorpay IntentHQ - Zero-Trust Intent-to-Transaction Control Plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "z3-solver>=4.13.0",
    "fastembed>=0.3.0",
    "onnxruntime>=1.18.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
